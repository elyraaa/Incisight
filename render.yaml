databases:
  - name: incisight-db
    databaseName: incisight
    user: incisight
    plan: free

services:
  - type: web
    name: incisight-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase: { name: incisight-db, property: connectionString }
      - key: TOOL_API_SECRET
        generateValue: true
      - key: ADMIN_API_SECRET
        generateValue: true
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
  - type: web
    name: incisight-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
